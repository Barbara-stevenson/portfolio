<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <style>
    text{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .eyebrow{font-weight:700;font-size:13px;letter-spacing:1.8px;fill:#5e6ad2}
    .title{font-weight:800;font-size:28px;fill:#2a394a}
    .sub{font-weight:500;font-size:15px;fill:#5b6b7b}
    .zone{font-weight:800;font-size:17px;fill:#2a394a}
    .zonesub{font-weight:500;font-size:13.5px;fill:#5b6b7b}
    .ownlbl{font-weight:700;font-size:11px;letter-spacing:.5px}
    .nav{font-weight:600;font-size:12.5px;fill:#5b6b7b}
    .legend{font-weight:600;font-size:14px;fill:#2a394a}
  </style>

  <rect width="1200" height="640" fill="#f6fafb"/>

  <text x="32" y="42" class="eyebrow">THE HYBRID ARCHITECTURE</text>
  <text x="32" y="78" class="title">Two embedded surfaces. The rest is ours.</text>
  <text x="32" y="104" class="sub">One Method screen, two owners. A screen only goes to Stripe when the liability is high and we can still brand it.</text>

  <!-- app frame -->
  <rect x="32" y="136" width="1136" height="440" rx="18" fill="#ffffff" stroke="#dce3e8" stroke-width="2"/>
  <rect x="32" y="136" width="1136" height="46" rx="18" fill="#eef1f4"/>
  <rect x="32" y="164" width="1136" height="18" fill="#eef1f4"/>
  <circle cx="62" cy="159" r="6" fill="#dce3e8"/><circle cx="82" cy="159" r="6" fill="#dce3e8"/><circle cx="102" cy="159" r="6" fill="#dce3e8"/>
  <text x="132" y="164" class="nav">Method · Payments</text>

  <!-- sidebar -->
  <rect x="32" y="182" width="170" height="394" fill="#f6fafb"/>
  <line x1="202" y1="182" x2="202" y2="576" stroke="#e2e8ef"/>
  <text x="54" y="216" class="nav">Dashboard</text>
  <text x="54" y="246" class="nav" fill="#5e6ad2" font-weight="700">Payments</text>
  <text x="54" y="276" class="nav">Invoices</text>
  <text x="54" y="306" class="nav">Customers</text>
  <text x="54" y="336" class="nav">Settings</text>

  <!-- Method-owned zones -->
  <rect x="224" y="206" width="616" height="112" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="244" y="232" class="ownlbl" fill="#2563c9">CUSTOM METHOD UI · VIA APIS</text>
  <text x="244" y="258" class="zone">Transactions &amp; financial overview</text>
  <text x="244" y="280" class="zonesub">Payments, refunds and disputes in one list · gross → fees → net</text>
  <rect x="244" y="294" width="520" height="9" rx="4.5" fill="#c9dbf7"/>

  <rect x="224" y="334" width="616" height="112" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="244" y="360" class="ownlbl" fill="#2563c9">CUSTOM METHOD UI · VIA APIS</text>
  <text x="244" y="386" class="zone">Payouts, balance &amp; reconciliation</text>
  <text x="244" y="408" class="zonesub">Available vs pending · each payout unpacked into its transactions</text>
  <rect x="244" y="422" width="430" height="9" rx="4.5" fill="#c9dbf7"/>

  <rect x="224" y="462" width="616" height="98" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="244" y="488" class="ownlbl" fill="#2563c9">CUSTOM METHOD UI · VIA APIS</text>
  <text x="244" y="514" class="zone">Refunds, disputes &amp; reporting</text>
  <text x="244" y="536" class="zonesub">Refund reasons, stock outcomes, dispute evidence — all Method UI</text>

  <!-- the embedded surfaces -->
  <rect x="864" y="206" width="280" height="112" rx="12" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="884" y="232" class="ownlbl" fill="#6d40c8">STRIPE EMBEDDED</text>
  <text x="884" y="258" class="zone">Account onboarding</text>
  <text x="884" y="280" class="zonesub">KYC / KYB · identity docs ·</text>
  <text x="884" y="296" class="zonesub">bank connection for payouts</text>

  <rect x="864" y="334" width="280" height="112" rx="12" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="884" y="360" class="ownlbl" fill="#6d40c8">STRIPE EMBEDDED</text>
  <text x="884" y="386" class="zone">Card checkout</text>
  <text x="884" y="408" class="zonesub">Card + ACH capture · saved</text>
  <text x="884" y="424" class="zonesub">methods (Setup Intents)</text>

  <rect x="864" y="462" width="280" height="98" rx="12" fill="#faf7ff" stroke="#e4d9f9" stroke-width="1.5"/>
  <text x="884" y="490" class="zone" fill="#6d40c8">Both brandable</text>
  <text x="884" y="514" class="zonesub">Stripe carries the liability and</text>
  <text x="884" y="532" class="zonesub">still lets us keep our brand.</text>
  <text x="884" y="550" class="zonesub">That was the test.</text>

  <!-- legend -->
  <rect x="32" y="602" width="15" height="15" rx="4" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="57" y="614" class="legend">Stripe embedded — certified UI, themed to Method's design system</text>
  <rect x="560" y="602" width="15" height="15" rx="4" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="585" y="614" class="legend">Custom Method UI over Stripe's APIs</text>
</svg>
