<svg width="1040" height="666" viewBox="0 0 1040 666" xmlns="http://www.w3.org/2000/svg">
  <style>
    text{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .eyebrow{font-weight:700;font-size:12.5px;letter-spacing:1.8px;fill:#5e6ad2}
    .title{font-weight:800;font-size:28px;fill:#2a394a}
    .sub{font-weight:500;font-size:14.5px;fill:#5b6b7b}
    .colhead{font-weight:800;font-size:17px;fill:#2a394a}
    .colnote{font-weight:500;font-size:12.5px;fill:#8a97a3}
    .crit{font-weight:800;font-size:15.5px;fill:#2a394a}
    .critsub{font-weight:700;font-size:10.5px;letter-spacing:1.2px;fill:#8a97a3}
    .val{font-weight:500;font-size:13.5px;fill:#2a394a}
    .why{font-weight:600;font-size:13.5px;fill:#4a53b8}
    .pill{font-weight:700;font-size:10.5px;letter-spacing:.6px}
  </style>

  <rect width="1040" height="666" fill="#f6fafb"/>

  <text x="32" y="46" class="eyebrow">PROVIDER BAKE-OFF · BUILD VS PARTNER</text>
  <text x="32" y="82" class="title">The criterion that decided it wasn't price</text>
  <text x="32" y="108" class="sub">Four axes. Three were close. The one that wasn't is the one we'd have to live inside every day.</text>

  <!-- column headers -->
  <text x="56" y="172" class="critsub">CRITERION</text>

  <rect x="320" y="142" width="380" height="42" rx="10" fill="#eef0fb"/>
  <text x="336" y="170" class="colhead">Stripe</text>
  <rect x="608" y="151" width="76" height="24" rx="12" fill="#187430"/>
  <text x="646" y="167" class="pill" fill="#ffffff" text-anchor="middle">CHOSEN</text>

  <text x="712" y="170" class="colhead">Rainforest</text>
  <text x="826" y="170" class="colnote">US-focused challenger</text>

  <!-- ROW 1: the deciding criterion -->
  <rect x="32" y="192" width="976" height="140" rx="16" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <rect x="32" y="192" width="6" height="140" rx="3" fill="#5e6ad2"/>

  <text x="56" y="220" class="critsub" fill="#5e6ad2">DECIDING CRITERION</text>
  <text x="56" y="244" class="crit">Embedded-component</text>
  <text x="56" y="264" class="crit">maturity</text>

  <text x="336" y="224" class="val">Deepest embedded toolkit. The two surfaces we</text>
  <text x="336" y="244" class="val">took, KYC/KYB onboarding and card checkout,</text>
  <text x="336" y="264" class="val">both themed to Method rather than bolted on.</text>

  <text x="712" y="224" class="val">Thinner component set. Those</text>
  <text x="712" y="244" class="val">screens would have been ours to</text>
  <text x="712" y="264" class="val">build, own and maintain.</text>

  <line x1="56" y1="288" x2="984" y2="288" stroke="#e4e7f7" stroke-width="1.5"/>
  <circle cx="62" cy="306" r="4" fill="#5e6ad2"/>
  <text x="78" y="311" class="why">Why this decided it: every gap in the provider's toolkit becomes Method's design debt, not theirs, and we're the ones living in it.</text>

  <!-- ROW 2 -->
  <rect x="32" y="348" width="976" height="78" rx="16" fill="#ffffff" stroke="#dce3e8" stroke-width="1.5"/>
  <text x="56" y="382" class="crit">Compliance coverage</text>
  <text x="336" y="382" class="val">Battle-tested KYC/KYB. PCI scope carried by the</text>
  <text x="336" y="402" class="val">provider. Years of work that isn't Method's craft.</text>
  <text x="712" y="382" class="val">Covered for the US. Less proven at</text>
  <text x="712" y="402" class="val">the onboarding volume we planned for.</text>

  <!-- ROW 3 -->
  <rect x="32" y="442" width="976" height="78" rx="16" fill="#ffffff" stroke="#dce3e8" stroke-width="1.5"/>
  <text x="56" y="476" class="crit">Global scale</text>
  <text x="336" y="476" class="val">Room to grow internationally without</text>
  <text x="336" y="496" class="val">re-platforming a live payments rail.</text>
  <text x="712" y="476" class="val">US-focused by design.</text>

  <!-- ROW 4: the axis we lost -->
  <rect x="32" y="536" width="976" height="98" rx="16" fill="#ffffff" stroke="#dce3e8" stroke-width="1.5"/>
  <text x="56" y="570" class="crit">Pricing economics</text>
  <rect x="56" y="582" width="94" height="23" rx="11.5" fill="#fef6e7"/>
  <text x="103" y="597" class="pill" fill="#9c5202" text-anchor="middle">THEY WON</text>
  <text x="336" y="570" class="val">Direct Charges + application fees: a configurable</text>
  <text x="336" y="590" class="val">fee on every transaction, replacing the 20%</text>
  <text x="336" y="610" class="val">rev-share we were living on.</text>
  <text x="712" y="570" class="val">Sharper headline rate. They</text>
  <text x="712" y="590" class="val">genuinely won this axis, just not</text>
  <text x="712" y="610" class="val">the one we'd touch every day.</text>

</svg>
