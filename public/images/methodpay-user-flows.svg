<svg width="1800" height="1080" viewBox="0 0 1800 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a97a3"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f8f3a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c8372d"/></marker>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .eyebrow{font-weight:700;font-size:14px;letter-spacing:2px;fill:#5e6ad2}
    .title{font-weight:800;font-size:30px;fill:#2a394a}
    .sub{font-weight:500;font-size:15px;fill:#5b6b7b}
    .flowlbl{font-weight:700;font-size:17px;fill:#2a394a}
    .nt{font-weight:600;font-size:13px;fill:#2a394a}
    .tag{font-weight:700;font-size:10px;letter-spacing:.5px}
    .startt{font-weight:700;font-size:13px;fill:#ffffff}
    .dia{font-weight:600;font-size:12px;fill:#8a5a00}
    .al{font-weight:700;font-size:11px}
    .chip{font-weight:500;font-size:12px;fill:#5b6b7b}
    .leg{font-weight:500;font-size:13px;fill:#2a394a}
  </style>

  <rect width="1800" height="1080" fill="#f6fafb"/>
  <text x="40" y="50" class="eyebrow">USER FLOWS · OWNERSHIP-TINTED</text>
  <text x="40" y="86" class="title">Three money flows, end to end — who owns each step</text>
  <text x="40" y="112" class="sub">Violet = inside a Stripe embedded component (borrowed vault) · Blue = custom Method UI over APIs (our storefront)</text>

  <!-- FLOW A: onboarding -->
  <text x="40" y="166" class="flowlbl">A · Onboarding &amp; application</text>
  <line x1="40" y1="178" x2="1760" y2="178" stroke="#e2e8ef"/>
  <rect x="40" y="204" width="96" height="46" rx="23" fill="#2a394a"/><text x="88" y="233" class="startt" text-anchor="middle">Entry</text>
  <path d="M136,227 H168" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="172" y="193" width="210" height="68" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="186" y="212" class="tag" fill="#2563c9">METHOD UI</text>
  <text x="277" y="233" class="nt" text-anchor="middle">"Set up payments"</text>
  <text x="277" y="250" class="nt" text-anchor="middle">CTA at moment of intent</text>
  <path d="M382,227 H414" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="418" y="193" width="230" height="68" rx="12" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="432" y="212" class="tag" fill="#6d40c8">STRIPE EMBEDDED</text>
  <text x="533" y="233" class="nt" text-anchor="middle">KYC / KYB + bank</text>
  <text x="533" y="250" class="nt" text-anchor="middle">connection, Method-themed</text>
  <path d="M648,227 H680" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="684" y="193" width="180" height="68" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="698" y="212" class="tag" fill="#2563c9">METHOD UI</text>
  <text x="774" y="237" class="nt" text-anchor="middle">Application submitted</text>
  <path d="M864,227 H896" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- status ladder -->
  <rect x="900" y="204" width="130" height="46" rx="23" fill="#eef1f4" stroke="#dce3e8"/><text x="965" y="232" class="nt" text-anchor="middle">Processing</text>
  <path d="M1030,227 H1058" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polygon points="1130,185 1200,227 1130,269 1060,227" fill="#fef6e7" stroke="#b25e02" stroke-width="1.5"/>
  <text x="1130" y="223" class="dia" text-anchor="middle">Risk</text><text x="1130" y="238" class="dia" text-anchor="middle">review</text>
  <path d="M1200,227 H1240" stroke="#1f8f3a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="1220" y="218" class="al" fill="#1f8f3a" text-anchor="middle">OK</text>
  <rect x="1244" y="193" width="220" height="68" rx="12" fill="#e7f6ec" stroke="#1f8f3a" stroke-width="1.5"/>
  <text x="1354" y="223" class="nt" text-anchor="middle">Approved →</text>
  <text x="1354" y="240" class="nt" text-anchor="middle">payments active + next step</text>
  <path d="M1464,227 H1494" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="1494" y="210" width="196" height="34" rx="17" fill="#eef1f4" stroke="#dce3e8"/>
  <text x="1512" y="232" class="chip">First-invoice prompt</text>
  <!-- needs info loop + declined -->
  <path d="M1130,269 L1130,318 L620,318 L620,265" stroke="#b25e02" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>
  <text x="860" y="310" class="al" fill="#b25e02">Needs information — loops back, never dead-ends</text>
  <path d="M1200,245 L1260,300 L1290,300" stroke="#c8372d" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#ar)"/>
  <rect x="1294" y="282" width="250" height="40" rx="12" fill="#fdecea" stroke="#c8372d" stroke-width="1.5"/>
  <text x="1419" y="307" class="nt" text-anchor="middle">Declined → routed to team</text>

  <!-- FLOW B: getting paid -->
  <text x="40" y="420" class="flowlbl">B · Getting paid</text>
  <line x1="40" y1="432" x2="1760" y2="432" stroke="#e2e8ef"/>
  <rect x="40" y="458" width="150" height="60" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="54" y="477" class="tag" fill="#2563c9">METHOD UI</text>
  <text x="115" y="500" class="nt" text-anchor="middle">Invoice sent</text>
  <path d="M190,488 H222" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="226" y="458" width="170" height="60" rx="12" fill="#eef1f4" stroke="#dce3e8"/>
  <text x="311" y="483" class="nt" text-anchor="middle">Customer opens</text>
  <text x="311" y="500" class="nt" text-anchor="middle">pay link</text>
  <path d="M396,488 H428" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="432" y="458" width="230" height="60" rx="12" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="446" y="477" class="tag" fill="#6d40c8">STRIPE EMBEDDED</text>
  <text x="547" y="500" class="nt" text-anchor="middle">Branded checkout · card / ACH</text>
  <path d="M662,488 H694" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polygon points="762,450 828,488 762,526 696,488" fill="#fef6e7" stroke="#b25e02" stroke-width="1.5"/>
  <text x="762" y="484" class="dia" text-anchor="middle">Charge</text><text x="762" y="499" class="dia" text-anchor="middle">succeeds?</text>
  <path d="M828,488 H866" stroke="#1f8f3a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <rect x="870" y="458" width="200" height="60" rx="12" fill="#e7f6ec" stroke="#1f8f3a" stroke-width="1.5"/>
  <text x="970" y="483" class="nt" text-anchor="middle">Confirmation +</text>
  <text x="970" y="500" class="nt" text-anchor="middle">receipt email</text>
  <path d="M1070,488 H1102" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="1106" y="458" width="230" height="60" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="1120" y="477" class="tag" fill="#2563c9">METHOD UI</text>
  <text x="1221" y="500" class="nt" text-anchor="middle">Real-time status on invoice</text>
  <path d="M1336,488 H1368" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="1372" y="471" width="240" height="34" rx="17" fill="#eef1f4" stroke="#dce3e8"/>
  <text x="1390" y="493" class="chip">Saved method → next time one-click</text>
  <path d="M762,526 L762,570 L866,570" stroke="#c8372d" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#ar)"/>
  <rect x="870" y="548" width="300" height="44" rx="12" fill="#fdecea" stroke="#c8372d" stroke-width="1.5"/>
  <text x="1020" y="568" class="nt" text-anchor="middle">Branded error — fallback guidance,</text>
  <text x="1020" y="584" class="nt" text-anchor="middle">retry without losing the attempt</text>

  <!-- FLOW C: refund & dispute -->
  <text x="40" y="686" class="flowlbl">C · Refund &amp; dispute</text>
  <line x1="40" y1="698" x2="1760" y2="698" stroke="#e2e8ef"/>
  <rect x="40" y="724" width="200" height="60" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="54" y="743" class="tag" fill="#2563c9">METHOD UI</text>
  <text x="140" y="766" class="nt" text-anchor="middle">Transaction detail</text>
  <path d="M240,754 H272" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="276" y="724" width="230" height="60" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="391" y="749" class="nt" text-anchor="middle">Refund modal — partial / full</text>
  <text x="391" y="766" class="nt" text-anchor="middle">+ reason · deliberate weight</text>
  <path d="M506,754 H538" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polygon points="606,716 672,754 606,792 540,754" fill="#fef6e7" stroke="#b25e02" stroke-width="1.5"/>
  <text x="606" y="750" class="dia" text-anchor="middle">Refund</text><text x="606" y="765" class="dia" text-anchor="middle">succeeds?</text>
  <path d="M672,754 H710" stroke="#1f8f3a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <rect x="714" y="724" width="220" height="60" rx="12" fill="#e7f6ec" stroke="#1f8f3a" stroke-width="1.5"/>
  <text x="824" y="749" class="nt" text-anchor="middle">Row updates + customer</text>
  <text x="824" y="766" class="nt" text-anchor="middle">notified · books recorded</text>
  <path d="M606,792 L606,830 L714,830" stroke="#c8372d" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#ar)"/>
  <rect x="718" y="810" width="216" height="40" rx="12" fill="#fdecea" stroke="#c8372d" stroke-width="1.5"/>
  <text x="826" y="835" class="nt" text-anchor="middle">Inline error — attempt kept</text>
  <!-- dispute branch -->
  <rect x="1010" y="724" width="220" height="60" rx="12" fill="#fdecea" stroke="#c8372d" stroke-width="1.5"/>
  <text x="1024" y="743" class="tag" fill="#c8372d">EVENT</text>
  <text x="1120" y="766" class="nt" text-anchor="middle">Dispute opened — flagged</text>
  <path d="M1230,754 H1262" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="1266" y="724" width="230" height="60" rx="12" fill="#f1ecfc" stroke="#6d40c8" stroke-width="1.5"/>
  <text x="1280" y="743" class="tag" fill="#6d40c8">STRIPE EMBEDDED</text>
  <text x="1381" y="766" class="nt" text-anchor="middle">Evidence + response</text>
  <path d="M1496,754 H1528" stroke="#8a97a3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="1532" y="724" width="180" height="60" rx="12" fill="#e8f0fd" stroke="#2563c9" stroke-width="1.5"/>
  <text x="1622" y="749" class="nt" text-anchor="middle">Won / Lost status</text>
  <text x="1622" y="766" class="nt" text-anchor="middle">+ deadline alerts</text>

  <!-- legend -->
  <line x1="40" y1="960" x2="1760" y2="960" stroke="#e2e8ef"/>
  <text x="40" y="1000" class="eyebrow">LEGEND</text>
  <g>
    <rect x="170" y="986" width="22" height="18" rx="5" fill="#f1ecfc" stroke="#6d40c8"/><text x="202" y="1000" class="leg">Stripe embedded component (borrowed vault)</text>
    <rect x="560" y="986" width="22" height="18" rx="5" fill="#e8f0fd" stroke="#2563c9"/><text x="592" y="1000" class="leg">Custom Method UI via APIs (our storefront)</text>
    <polygon points="950,986 964,995 950,1004 936,995" fill="#fef6e7" stroke="#b25e02"/><text x="974" y="1000" class="leg">Decision / review gate</text>
    <rect x="1180" y="986" width="22" height="18" rx="5" fill="#e7f6ec" stroke="#1f8f3a"/><text x="1212" y="1000" class="leg">Success state</text>
    <line x1="1360" y1="995" x2="1400" y2="995" stroke="#c8372d" stroke-width="2" stroke-dasharray="5 5"/><text x="1410" y="1000" class="leg">Unhappy path — always recoverable</text>
  </g>
</svg>
